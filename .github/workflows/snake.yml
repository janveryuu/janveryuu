name: Generate snake animation
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#67e8f9&color_dots=#111827,#0c4a6e,#0e7490,#06b6d4,#a5f3fc
            dist/snake.svg?palette=github-dark&color_snake=#67e8f9&color_dots=#111827,#0c4a6e,#0e7490,#06b6d4,#a5f3fc
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
